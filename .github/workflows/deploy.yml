name: Deploy Cumuloscope to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 1,4,7,10 *' # trimestriel 1er jan/avr/juil/oct 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache RNE
        uses: actions/cache@v4
        with:
          path: .cache/rne
          key: rne-${{ hashFiles('scripts/preprocess.mjs') }}
          restore-keys: |
            rne-

      - name: Cache HATVP
        uses: actions/cache@v4
        with:
          path: .cache/hatvp
          key: hatvp-${{ hashFiles('scripts/preprocess.mjs') }}
          restore-keys: |
            hatvp-

      - name: Cache Senat ODSEN
        uses: actions/cache@v4
        with:
          path: .cache/senat
          key: senat-${{ hashFiles('scripts/preprocess.mjs') }}
          restore-keys: |
            senat-

      - name: Cache AMO Deputes
        uses: actions/cache@v4
        with:
          path: .cache/amo
          key: amo-${{ hashFiles('scripts/preprocess.mjs') }}
          restore-keys: |
            amo-

      - name: Build data (RNE + HATVP shards)
        run: npm run data:build

      - name: Build Astro site
        run: npx astro build --base /cumuloscope/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
